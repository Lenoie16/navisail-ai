services:
  backend:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -e . && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"
    volumes: [".:/workspace"]
    environment:
      DATABASE_URL: postgresql+psycopg://navisail:navisail@postgres:5432/navisail
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --dir frontend dev --hostname 0.0.0.0"
    volumes: [".:/workspace"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: navisail
      POSTGRES_USER: navisail
      POSTGRES_PASSWORD: navisail
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navisail -d navisail"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
