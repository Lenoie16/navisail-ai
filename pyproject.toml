[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navisail-ai"
version = "0.1.0-rc.1"
description = "Maritime logistics decision intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "geoalchemy2>=0.15,<0.20",
  "alembic>=1.14,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "redis>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pytest-cov>=6.0,<7.0",
  "aiosqlite>=0.20,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pytest-cov>=6.0,<7.0",
  "aiosqlite>=0.20,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = "^(backend/tests|scripts)/"

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
fail_under = 75
show_missing = true
